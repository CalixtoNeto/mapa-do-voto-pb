name: Gerar análises

# Acionado à mão (Actions > Gerar análises > Run workflow). Baixa do TSE o cadastro e os bens dos
# candidatos, a prestação de contas e o comparecimento, e grava ANO-candidatos.json, ANO-financas.json e
# ANO-tTURNO-comparecimento.json em public/data/eleicoes/. Sem anos, refaz todas as eleições do site.
# Durante a campanha a prestação de contas é parcial: rode de novo depois do prazo da prestação final.
on:
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos separados por espaço (por exemplo, 2022 2024). Em branco: todos.'
        required: false
        type: string
        default: ''

permissions:
  contents: write   # commitar os dados gerados
  actions: write    # disparar a publicação do site

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  analises:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANOS: ${{ inputs.anos }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testar os geradores antes de usá-los
        run: npm test

      - name: Gerar as análises
        run: |
          [[ "$ANOS" =~ ^([0-9]{4}( +[0-9]{4})*)?$ ]] || { echo "Anos inválidos: $ANOS"; exit 1; }
          node scripts/gerar-analises.mjs $ANOS

      - name: Commitar e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Nenhuma mudança nos dados."; exit 0; fi
          git commit -m "dados: análises ${ANOS:-de todas as eleições} geradas pelo workflow"
          git pull --rebase
          git push
          # o push feito com o token do workflow não dispara o deploy, então chamamos o workflow de publicação
          gh workflow run pages.yml
